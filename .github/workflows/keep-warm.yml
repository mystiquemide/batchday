name: Keep demo warm

# The free Render instance sleeps after 15 idle minutes and takes about 30 s to wake.
# Ping it during the judging period so a judge's first visit loads straight away.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping until 2026-12-01
        run: |
          if [ "$(date -u +%Y%m%d)" -ge 20261201 ]; then echo "Judging period over"; exit 0; fi
          curl -sS -o /dev/null -w '%{http_code} %{time_total}s\n' --max-time 90 https://batchday.onrender.com/api/health
